version: 1.0
name: "ISO 22301 Emulation - AWS Evidence"
description: "Technical + hybrid controls to support ISO 22301 evidence collection in AWS."

# Convention:
# evidence[].type:
#   - aws_api: can be collected by AWS APIs
#   - securityhub: can be extracted from Security Hub findings/standards
#   - external: must be obtained outside AWS (documents, reports, minutes, DR exercise attestations)
# external placeholders will be emitted into the evidence pack and can be uploaded to S3 for linking.

controls:

  - id: BCP-LOG-01
    title: CloudTrail enabled, multi-region, validation, retention
    iso_ref: "ISO22301 Clauses 7.5, 9.1"
    evidence:
      - type: aws_api
        calls:
          - cloudtrail:DescribeTrails
          - cloudtrail:GetTrailStatus
          - cloudtrail:GetEventSelectors
      - type: aws_api
        calls:
          - logs:DescribeLogGroups

  - id: BCP-CONFIG-01
    title: AWS Config recording + delivery channel
    iso_ref: "ISO22301 Clause 9.1"
    evidence:
      - type: aws_api
        calls:
          - config:DescribeConfigurationRecorders
          - config:DescribeConfigurationRecorderStatus
          - config:DescribeDeliveryChannels

  - id: BCP-BACKUP-01
    title: Backup plans exist + protected resources list
    iso_ref: "ISO22301 Clause 8.4"
    evidence:
      - type: aws_api
        calls:
          - backup:ListBackupPlans
          - backup:ListProtectedResources
          - backup:ListBackupVaults

  - id: BCP-DATA-01
    title: S3 versioning + replication posture for critical buckets
    iso_ref: "ISO22301 Clause 8.4"
    evidence:
      - type: aws_api
        calls:
          - s3:ListBuckets
          - s3:GetBucketVersioning
          - s3:GetBucketReplication

  - id: BCP-RES-01
    title: Resilience posture - Multi-AZ for RDS critical DBs
    iso_ref: "ISO22301 Clause 8.2"
    evidence:
      - type: aws_api
        calls:
          - rds:DescribeDBInstances

  - id: BCP-MON-01
    title: Monitoring - CloudWatch alarms for availability signals
    iso_ref: "ISO22301 Clause 9.1"
    evidence:
      - type: aws_api
        calls:
          - cloudwatch:DescribeAlarms

  - id: BCP-DNS-01
    title: Route53 health checks and failover records
    iso_ref: "ISO22301 Clause 8.4"
    evidence:
      - type: aws_api
        calls:
          - route53:ListHealthChecks
          - route53:ListHostedZones
          - route53:ListResourceRecordSets

  - id: BCP-THREAT-01
    title: GuardDuty enabled (threat signals supporting continuity)
    iso_ref: "ISO22301 Clause 8.4"
    evidence:
      - type: aws_api
        calls:
          - guardduty:ListDetectors
          - guardduty:GetDetector

  - id: BCP-SH-01
    title: Security Hub enabled standards + sample findings as audit signals
    iso_ref: "ISO22301 Clause 9.1"
    evidence:
      - type: securityhub
        calls:
          - securityhub:DescribeHub
          - securityhub:GetEnabledStandards
          - securityhub:GetFindings

  # HYBRID / EXTERNAL EVIDENCE CONTROLS (placeholders)
  - id: BCP-EXT-DR-TEST-01
    title: DR exercise executed (evidence of test results)
    iso_ref: "ISO22301 Clause 8.5"
    evidence:
      - type: external
        required_artifacts:
          - "DR test report (PDF)"
          - "Change approval / CAB minutes (optional)"
          - "RTO/RPO achieved attestation"

  - id: BCP-EXT-BIA-01
    title: BIA documented and approved by business owners
    iso_ref: "ISO22301 Clause 8.3"
    evidence:
      - type: external
        required_artifacts:
          - "BIA document (PDF/DOCX)"
          - "Business owner approval evidence"

  - id: BCP-EXT-BCP-PLAN-01
    title: Business Continuity Plans and runbooks maintained
    iso_ref: "ISO22301 Clause 8.4"
    evidence:
      - type: external
        required_artifacts:
          - "BCP plan"
          - "Communication plan"
          - "Runbook repository link (Git) or exported PDF"
