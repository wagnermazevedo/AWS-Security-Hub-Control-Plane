version: 1.0
scope: "AWS technical controls supporting ISO 22301 BCMS"

controls:

# ─────────────────────────────
# GOVERNANCE & SCOPE
# ─────────────────────────────
- id: BCP-GOV-01
  title: AWS account and region scope defined
  iso_ref: "ISO22301: Clause 4, 8.1"
  evidence:
    - organizations:DescribeOrganization
    - ec2:DescribeRegions

- id: BCP-GOV-02
  title: Environment segregation (prod / non-prod)
  iso_ref: "ISO22301: Clause 8.1"
  evidence:
    - organizations:ListAccounts
    - tagging:Environment

- id: BCP-GOV-03
  title: Service Control Policies protecting BC posture
  iso_ref: "ISO22301: Clause 8.1"
  evidence:
    - organizations:ListPolicies
    - organizations:DescribePolicy

# ─────────────────────────────
# IDENTITY & ACCESS CONTINUITY
# ─────────────────────────────
- id: BCP-IAM-01
  title: MFA enforced for privileged users
  iso_ref: "ISO22301: Clause 7.5, 8.1"
  evidence:
    - iam:ListUsers
    - iam:ListMFADevices

- id: BCP-IAM-02
  title: Break-glass access documented and controlled
  iso_ref: "ISO22301: Clause 8.4"
  evidence:
    - iam:GetUser
    - iam:GetLoginProfile

- id: BCP-IAM-03
  title: IAM Access Analyzer enabled
  iso_ref: "ISO22301: Clause 9.1"
  evidence:
    - accessanalyzer:ListAnalyzers

# ─────────────────────────────
# LOGGING & TRACEABILITY
# ─────────────────────────────
- id: BCP-LOG-01
  title: CloudTrail enabled and retained
  iso_ref: "ISO22301: Clause 7.5, 9.1"
  evidence:
    - cloudtrail:DescribeTrails
    - logs:DescribeLogGroups

- id: BCP-LOG-02
  title: Centralized and immutable log storage
  iso_ref: "ISO22301: Clause 8.4"
  evidence:
    - s3:GetObjectLockConfiguration
    - s3:GetBucketVersioning

# ─────────────────────────────
# CONFIGURATION & CHANGE CONTROL
# ─────────────────────────────
- id: BCP-CONFIG-01
  title: AWS Config recording all supported resources
  iso_ref: "ISO22301: Clause 9.1"
  evidence:
    - config:DescribeConfigurationRecorders
    - config:DescribeDeliveryChannels

- id: BCP-CONFIG-02
  title: Configuration drift detection
  iso_ref: "ISO22301: Clause 10"
  evidence:
    - config:DescribeConfigRules
    - securityhub:GetFindings

# ─────────────────────────────
# BACKUP & DATA PROTECTION
# ─────────────────────────────
- id: BCP-BACKUP-01
  title: Backup plans defined for critical resources
  iso_ref: "ISO22301: Clause 8.4"
  evidence:
    - backup:ListBackupPlans
    - backup:ListProtectedResources

- id: BCP-BACKUP-02
  title: Cross-region backup copies
  iso_ref: "ISO22301: Clause 8.4"
  evidence:
    - backup:DescribeBackupVault

- id: BCP-BACKUP-03
  title: Restore tests executed and recorded
  iso_ref: "ISO22301: Clause 8.5"
  evidence:
    - type: manual_test_evidence
      description: "Restore test report"

# ─────────────────────────────
# AVAILABILITY & RESILIENCE
# ─────────────────────────────
- id: BCP-RES-01
  title: Multi-AZ deployment for critical workloads
  iso_ref: "ISO22301: Clause 8.2"
  evidence:
    - ec2:DescribeInstances
    - rds:DescribeDBInstances

- id: BCP-RES-02
  title: Load balancer health checks
  iso_ref: "ISO22301: Clause 8.4"
  evidence:
    - elbv2:DescribeTargetHealth

- id: BCP-RES-03
  title: Route53 failover configuration
  iso_ref: "ISO22301: Clause 8.4"
  evidence:
    - route53:ListHealthChecks
    - route53:ListResourceRecordSets

# ─────────────────────────────
# MONITORING & INCIDENT RESPONSE
# ─────────────────────────────
- id: BCP-MON-01
  title: CloudWatch alarms for availability signals
  iso_ref: "ISO22301: Clause 9.1"
  evidence:
    - cloudwatch:DescribeAlarms

- id: BCP-MON-02
  title: GuardDuty enabled for threat detection
  iso_ref: "ISO22301: Clause 8.4"
  evidence:
    - guardduty:ListDetectors
    - guardduty:GetFindingsStatistics

- id: BCP-MON-03
  title: Incident response orchestration in place
  iso_ref: "ISO22301: Clause 8.4"
  evidence:
    - ssm:DescribeDocument
    - ssm-incidents:ListResponsePlans

# ─────────────────────────────
# CONTINUITY EXECUTION
# ─────────────────────────────
- id: BCP-EXEC-01
  title: DR runbooks defined and versioned
  iso_ref: "ISO22301: Clause 8.4"
  evidence:
    - ssm:ListDocuments

- id: BCP-EXEC-02
  title: Evidence of DR or failover exercises
  iso_ref: "ISO22301: Clause 8.5"
  evidence:
    - type: execution_log
      source: "SSM Automation / Change Manager"
