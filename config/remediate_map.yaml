apiVersion: securityhub.shcp/v1
kind: RemediateMap

# Mapa declarativo: cada controle do AWS Foundational Security Best Practices
# (FSBP) tem o destino decidido antes do finding aparecer.
#   AUTO     -> o remediate corrige, confere o recurso e marca o finding RESOLVED
#   MANUAL   -> o remediate só marca o finding NOTIFIED, com nota e runbook
#   SUPPRESS -> o remediate marca o finding SUPPRESSED, com nota (use com parcimônia)
#
# O match é pelo ID do controle (Compliance.SecurityControlId), nunca por
# palavra-chave no título: um título muda, o ID do controle não.

# Recurso com esta tag não é corrigido nem ignorado: vira SUPPRESSED com a
# justificativa (valor da tag) e o dono (tag de dono). Exceção sem dono vira MANUAL.
exception:
  tag_key: scp-exception
  owner_tag_key: exception-owner

controls:
  S3.1:
    title: "S3 Block Public Access habilitado na conta"
    decision: AUTO
    action: s3_account_public_access_block
    severity: MEDIUM

  S3.8:
    title: "S3 Block Public Access habilitado no bucket"
    decision: AUTO
    action: s3_bucket_public_access_block
    severity: HIGH

  EC2.2:
    title: "Security group default da VPC sem regras de entrada e saída"
    decision: AUTO
    action: ec2_default_sg_revoke_all
    severity: HIGH
    note: "O SG default não deve ser usado por recursos. Confirme no plano que nenhum recurso depende dele."

  EC2.7:
    title: "Criptografia de EBS habilitada por padrão na região"
    decision: AUTO
    action: ec2_ebs_encryption_by_default
    severity: MEDIUM

  IAM.4:
    title: "Usuário root sem access key"
    decision: MANUAL
    severity: CRITICAL
    reason: "Chave de root se remove com login de root e MFA, nunca por script"
    runbook: "https://docs.aws.amazon.com/IAM/latest/UserGuide/id_root-user_manage_delete-key.html"
